
server:
  port: ${PORT:8085}

spring:
  application:
    name: campuslab-ms-report

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:campuslab-report-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    listener:
      auto-startup: ${CAMPUSLAB_KAFKA_ENABLED:false}
      ack-mode: record

  datasource:
    url: ${DB_URL:jdbc:h2:file:./reportdb}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

campuslab:
  kafka:
    provision-dlt-topics: ${CAMPUSLAB_PROVISION_DLT_TOPICS:false}

    topics:
      booking-events: ${CAMPUSLAB_REPORT_BOOKING_TOPIC:campuslab.booking.events}
      occupancy-events: ${CAMPUSLAB_REPORT_OCCUPANCY_TOPIC:campuslab.occupancy.events}
